<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shift Tracker — Учёт смен</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-2048.png">
    <link rel="apple-touch-icon" href="icon-2048.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 212, 170, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4aa 0%, #00b894 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 170, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #00d4aa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4aa;
            background: rgba(15, 23, 42, 0.8);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4aa 0%, #00b894 100%);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 8px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(0, 212, 170, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #00d4aa;
        }

        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .month-btn {
            background: rgba(0, 212, 170, 0.15);
            border: none;
            color: #00d4aa;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
        }

        .month-btn:active {
            background: rgba(0, 212, 170, 0.3);
        }

        .month-label {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }

        .shifts-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shift-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #00d4aa;
            position: relative;
        }

        .shift-info {
            flex: 1;
        }

        .shift-date {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .shift-details {
            font-size: 12px;
            color: #94a3b8;
        }

        .shift-earnings {
            font-size: 16px;
            font-weight: 700;
            color: #00d4aa;
            margin-right: 12px;
        }

        .shift-delete {
            background: rgba(239, 68, 68, 0.15);
            border: none;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .shift-delete:active {
            background: rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00d4aa;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 212, 170, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon-2048.png" alt="Icon" class="header-icon">
        <h1>Shift Tracker</h1>
    </div>

    <div class="card">
        <div class="card-title">➕ Новая смена</div>
        <div class="form-group">
            <label>Дата</label>
            <input type="date" id="shiftDate">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Часы</label>
                <input type="number" id="shiftHours" placeholder="8" step="0.5" min="0.5" inputmode="decimal">
            </div>
            <div class="form-group">
                <label>Ставка (₽/час)</label>
                <input type="number" id="shiftRate" placeholder="500" step="1" min="0" inputmode="decimal">
            </div>
        </div>
        <div class="form-group">
            <label>Примечание (необязательно)</label>
            <input type="text" id="shiftNote" placeholder="Например: ночная смена">
        </div>
        <button class="btn-primary" onclick="addShift()">Добавить смену</button>
    </div>

    <div class="card">
        <div class="card-title">📊 Статистика</div>
        <div class="month-selector">
            <button class="month-btn" onclick="changeMonth(-1)">‹</button>
            <div class="month-label" id="monthLabel">Ноябрь 2026</div>
            <button class="month-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Часов</div>
                <div class="stat-value" id="totalHours">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Заработано</div>
                <div class="stat-value" id="totalEarnings">0 ₽</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 Смены за месяц</div>
        <div class="shifts-list" id="shiftsList">
            <div class="empty-state">
                <div class="empty-state-icon">📅</div>
                <div>Пока нет смен за этот месяц</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'shift_tracker_data';
        const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('Ошибка чтения данных:', e);
                return [];
            }
        }

        function saveData(shifts) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts));
            } catch (e) {
                console.error('Ошибка сохранения:', e);
                showToast('Ошибка сохранения данных', true);
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        function addShift() {
            const dateInput = document.getElementById('shiftDate');
            const hoursInput = document.getElementById('shiftHours');
            const rateInput = document.getElementById('shiftRate');
            const noteInput = document.getElementById('shiftNote');

            const date = dateInput.value;
            const hours = parseFloat(hoursInput.value.replace(',', '.'));
            const rate = parseFloat(rateInput.value.replace(',', '.'));
            const note = noteInput.value.trim();

            if (!date) {
                showToast('Выберите дату', true);
                return;
            }
            if (isNaN(hours) || hours <= 0) {
                showToast('Введите корректные часы', true);
                return;
            }
            if (isNaN(rate) || rate < 0) {
                showToast('Введите корректную ставку', true);
                return;
            }

            const shifts = loadData();
            const newShift = {
                id: generateId(),
                date: date,
                hours: hours,
                rate: rate,
                note: note,
                total: Math.round(hours * rate * 100) / 100,
                createdAt: new Date().toISOString()
            };

            shifts.push(newShift);
            saveData(shifts);

            hoursInput.value = '';
            rateInput.value = '';
            noteInput.value = '';

            const shiftDate = new Date(date);
            currentMonth = shiftDate.getMonth();
            currentYear = shiftDate.getFullYear();

            render();
            showToast(`✅ Смена добавлена! +${newShift.total.toLocaleString('ru-RU')} ₽`);
        }

        function deleteShift(id) {
            if (!confirm('Удалить эту смену?')) return;
            let shifts = loadData();
            shifts = shifts.filter(s => s.id !== id);
            saveData(shifts);
            render();
            showToast('Смена удалена');
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            render();
        }

        function render() {
            document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

            const shifts = loadData();
            const monthShifts = shifts.filter(s => {
                const d = new Date(s.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            const totalHours = monthShifts.reduce((sum, s) => sum + s.hours, 0);
            const totalEarnings = monthShifts.reduce((sum, s) => sum + s.total, 0);

            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('totalEarnings').textContent = totalEarnings.toLocaleString('ru-RU', {maximumFractionDigits: 2}) + ' ₽';

            const listEl = document.getElementById('shiftsList');
            if (monthShifts.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <div>Пока нет смен за этот месяц</div>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = monthShifts.map(s => {
                const d = new Date(s.date);
                const dateStr = d.toLocaleDateString('ru-RU', {day: '2-digit', month: 'short'});
                const noteHtml = s.note ? `<div class="shift-details">${escapeHtml(s.note)}</div>` : '';
                return `
                    <div class="shift-item">
                        <div class="shift-info">
                            <div class="shift-date">${dateStr}</div>
                            <div class="shift-details">${s.hours} ч × ${s.rate} ₽</div>
                            ${noteHtml}
                        </div>
                        <div class="shift-earnings">${s.total.toLocaleString('ru-RU', {maximumFractionDigits: 2})} ₽</div>
                        <button class="shift-delete" onclick="deleteShift('${s.id}')">✕</button>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.className = 'toast';
            }, 2500);
        }

        document.getElementById('shiftDate').value = new Date().toISOString().split('T')[0];

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW не зарегистрирован:', err));
        }

        render();
    </script>
</body>
  </html>
